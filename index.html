<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색엔진(구글, 네이버 등)에 노출되지 않도록 설정 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="Yeti" content="noindex, nofollow">
<title>Blooming 단어 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. 시작 화면 -->
<section id="home" class="screen">
  <header class="hero">
    <div class="logo">🌸</div>
    <h1>Blooming 단어 테스트</h1>
    <p>범위를 고르고 바로 테스트하거나 시험지를 만들어 보세요.</p>
  </header>

  <div class="card">
    <h2>1. 범위 선택</h2>
    <div class="row">
      <label>시작 <select id="dayFrom"></select></label>
      <span class="tilde">~</span>
      <label>끝 <select id="dayTo"></select></label>
    </div>
    <p class="hint">선택된 단어: <b id="poolCount">0</b>개</p>

    <h2>2. 문제 개수</h2>
    <div class="row">
      <input id="count" type="number" min="1" value="20" inputmode="numeric">
      <span>개</span>
      <button class="chip" data-n="20">20</button>
      <button class="chip" data-n="50">50</button>
      <button class="chip" data-n="100">100</button>
      <button class="chip" id="allBtn">전체</button>
    </div>
    <p class="hint" id="countWarn"></p>
  </div>

  <div class="actions">
    <button id="startTest" class="btn primary">✏️ 바로 테스트</button>
    <button id="makeSheet" class="btn secondary">🖨️ 시험지 만들기</button>
  </div>
</section>

<!-- 2. 바로 테스트 -->
<section id="quiz" class="screen hidden">
  <div class="quiz-top">
    <button class="link" id="quitQuiz">← 그만하기</button>
    <span id="progressText"></span>
  </div>
  <div class="bar"><div id="progressBar"></div></div>
  <div class="card question">
    <div id="qWord" class="word"></div>
    <div id="options" class="options"></div>
    <button id="nextBtn" class="btn primary hidden">다음 →</button>
  </div>
</section>

<!-- 3. 결과 -->
<section id="result" class="screen hidden">
  <div class="card center">
    <h2>테스트 결과</h2>
    <div id="scoreBig" class="score"></div>
    <p id="scoreSub" class="hint"></p>
  </div>
  <div id="wrongWrap" class="card">
    <h2>틀린 단어</h2>
    <table class="wrong-table">
      <thead><tr><th>단어</th><th>정답</th><th>내가 고른 답</th></tr></thead>
      <tbody id="wrongList"></tbody>
    </table>
  </div>
  <div class="actions">
    <button id="retryWrong" class="btn primary">틀린 단어 다시 풀기</button>
    <button id="goHome" class="btn secondary">처음으로</button>
  </div>
</section>

<!-- 4. 시험지 미리보기 -->
<section id="sheet" class="hidden">
  <div class="toolbar">
    <button class="link" id="sheetBack">← 돌아가기</button>
    <div class="toolbar-right">
      <button id="reshuffle" class="btn small secondary">🔀 다시 섞기</button>
      <button id="printBtn" class="btn small primary">🖨️ 인쇄 / PDF 저장</button>
    </div>
    <p class="toolbar-hint">PDF로 저장하려면 인쇄 창에서 대상(프린터)을 <b>“PDF로 저장”</b>으로 바꾸세요.</p>
  </div>
  <div id="pages"></div>
</section>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
